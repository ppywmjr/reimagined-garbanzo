info:
  name: add course to plan
  type: http
  seq: 11

http:
  method: POST
  url: "{{reimagined-garbanzo-base-url}}/plans/{{planId}}/courses/{{courseId}}"
  headers:
    - name: x-internal-api-key
      value: "{{x-internal-api-key}}"
    - name: Authorization
      value: Bearer {{clerk_token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
